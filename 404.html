<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>404 — Склад Евгения, Воронеж</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:#0B0F17;
    color:#F5F3EE;
    font-family:'Inter','Segoe UI',Arial,sans-serif;
    line-height:1.5;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    max-width:520px;
    width:100%;
    background:#131A26;
    border:1px solid #26314480;
    border-radius:22px;
    padding:44px 40px;
    text-align:center;
  }
  .code{
    font-family:'Oswald','Inter',sans-serif;
    font-size:72px;
    font-weight:700;
    color:#F5A623;
    line-height:1;
    letter-spacing:.02em;
    text-transform:uppercase;
  }
  h1{
    font-family:'Oswald','Inter',sans-serif;
    font-size:24px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.01em;
    margin:14px 0 10px;
  }
  p{color:#A6B0C0; font-size:15px; margin-bottom:26px;}
  .actions{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}
  a.btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:#F5A623;
    color:#1a1204;
    font-weight:700;
    font-size:14.5px;
    text-decoration:none;
    padding:12px 20px;
    border-radius:12px;
    transition:background .15s ease;
  }
  a.btn:hover{background:#D9861A;}
  a.btn.ghost{
    background:transparent;
    color:#A6B0C0;
    border:1px solid #26314480;
  }
  a.btn.ghost:hover{border-color:#3A4458; color:#F5F3EE;}
</style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Страница не найдена</h1>
    <p>Такой страницы на складе нет — возможно, её перенесли или удалили. Каталог смотрите на главной, а по остаткам всегда можно уточнить напрямую.</p>
    <div class="actions">
      <a class="btn" href="/">На главную</a>
      <a class="btn ghost" href="tel:+79507678575">8 (950) 767-85-75</a>
    </div>
  </div>
</body>
</html>
